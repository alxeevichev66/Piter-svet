# Еженедельный SEO-отчёт: Вебмастер + Метрика → MAX и docs/seo-report.md
name: "SEO-отчёт"

on:
  schedule:
    - cron: "17 7 * * 1"   # понедельник, 10:17 по Москве
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/seo-report.yml", "tools/yandex_report.py"]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать отчёт
        id: rep
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: python3 tools/yandex_report.py

      - name: Сертификаты НУЦ Минцифры (для MAX)
        if: always()
        run: bash tools/ru-ca.sh /tmp/cacert.pem

      - name: Отправить в MAX
        if: always()
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_USER_ID: ${{ secrets.MAX_USER_ID }}
        run: |
          [ -f docs/seo-report.md ] || echo "Отчёт не собран: проверьте секрет YANDEX_TOKEN" > docs/seo-report.md
          python3 -c "import json;t=open('docs/seo-report.md',encoding='utf-8').read().replace('**','').replace('### ','').replace('## ','').replace('# ','')[:3900];print(json.dumps({'text':'📊 '+t},ensure_ascii=False))" > /tmp/msg.json
          code=$(curl -sS -m 30 --cacert /tmp/cacert.pem -X POST "https://platform-api2.max.ru/messages?user_id=$MAX_USER_ID" \
            -H "Authorization: $MAX_BOT_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/msg.json -o /tmp/max.json -w "%{http_code}")
          echo "MAX → HTTP $code"; [ "$code" = "200" ] || { head -c 300 /tmp/max.json; exit 1; }

      - name: Сохранить отчёт в репозиторий
        if: always()
        run: |
          git config user.name "seo-report-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/seo-report.md && git commit -m "SEO-отчёт $(date +%F) [skip ci]" && git push || echo "без изменений"
