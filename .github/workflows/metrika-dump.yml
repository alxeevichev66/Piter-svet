# Выгрузка Метрики в docs/metrika.json (для отчётов). Запуск вручную или при изменении скрипта.
name: "Выгрузка Метрики"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrika-dump.yml", "tools/metrika_dump.py"]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Выгрузить
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: python3 tools/metrika_dump.py

      - name: Сохранить
        run: |
          git config user.name "metrika-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/metrika.json && git commit -m "Метрика $(date +%F) [skip ci]" && git push || echo "без изменений"
