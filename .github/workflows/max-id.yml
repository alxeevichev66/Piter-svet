# Ручной запуск: показывает ваш user_id в MAX.
# Перед запуском напишите своему боту в MAX любое сообщение.
name: "MAX: узнать мой ID"

on:
  workflow_dispatch:

jobs:
  max-id:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Сертификаты НУЦ Минцифры
        run: bash tools/ru-ca.sh /tmp/cacert.pem

      - name: Получить последние сообщения боту
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          if [ -z "$MAX_BOT_TOKEN" ]; then echo "::error::Нет секрета MAX_BOT_TOKEN"; exit 1; fi
          for base in https://platform-api2.max.ru https://platform-api.max.ru; do
            code=$(curl -sS -m 30 --cacert /tmp/cacert.pem -H "Authorization: $MAX_BOT_TOKEN" "$base/updates?limit=100&timeout=0" -o /tmp/updates.json -w "%{http_code}" || echo 000)
            echo "$base → HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            head -c 300 /tmp/updates.json 2>/dev/null; echo
          done
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("/tmp/updates.json"))
          except Exception:
              print("::error::MAX не ответил. Проверьте токен бота."); raise SystemExit(1)
          seen = {}
          for u in data.get("updates", []):
              msg = u.get("message") or {}
              sender = msg.get("sender") or u.get("user") or {}
              uid = sender.get("user_id")
              if uid:
                  seen[uid] = sender.get("name") or sender.get("first_name") or ""
          if not seen:
              print("::warning::Сообщений боту не найдено. Напишите боту в MAX любое сообщение и запустите снова.")
          for uid, name in seen.items():
              print(f"MAX_USER_ID = {uid}   ({name})")
              print(f"::notice title=Ваш MAX_USER_ID::{uid} ({name})")
          PY
