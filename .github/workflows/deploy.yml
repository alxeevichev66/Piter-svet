# Автовыгрузка сайта на хостинг Reg.ru при каждом изменении в ветке main
name: Deploy to Reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Собрать список статей и sitemap.xml
        run: python3 tools/build.py

      - name: Создать api/config.php из секретов
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_USER_ID: ${{ secrets.MAX_USER_ID }}
        run: |
          python3 - <<'PY'
          import os, json
          def php(v): return json.dumps(v, ensure_ascii=False).replace('$', '\\$')
          cfg = {
              "telegram_token": os.environ.get("TG_BOT_TOKEN", ""),
              "telegram_chat_id": os.environ.get("TG_CHAT_ID", ""),
              "mail_to": os.environ.get("MAIL_TO", ""),
              "max_token": os.environ.get("MAX_BOT_TOKEN", ""),
              "max_user_id": os.environ.get("MAX_USER_ID", ""),
          }
          body = "<?php\nreturn [\n" + "".join(f"    {php(k)} => {php(v)},\n" for k, v in cfg.items()) + "];\n"
          open("api/config.php", "w", encoding="utf-8").write(body)
          PY

      - name: Сертификаты НУЦ Минцифры для API MAX
        run: |
          mkdir -p api/certs
          bash tools/ru-ca.sh api/certs/cacert.pem || echo "::warning::Не удалось собрать сертификаты Минцифры — отправка в MAX будет пробовать прежний домен"

      - name: Выгрузить по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            docs/**
            README.md
            api/config.example.php
            api/data/**
